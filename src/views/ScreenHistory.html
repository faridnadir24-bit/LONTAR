<!-- SCREEN 4 — ARSIP (DIGITAL HERITAGE COLLECTION)    -->
<!-- ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ -->
<section id="screen-history" class="screen-view screen-hidden flex-col flex-1 bg-white dark:bg-zinc-900 pb-14">

  <!-- Archive Header -->
  <div class="px-5 pt-5 pb-3 shrink-0">
    <div class="flex items-center justify-between mb-1">
      <div>
        <h2 class="font-sans text-[22px] font-extrabold text-slate-900 dark:text-white">Arsip Koleksi</h2>
        <p class="text-[12px] text-slate-500 dark:text-zinc-400 mt-0.5">Dokumentasi hasil pindaian naskah Nusantara</p>
      </div>
      <button
        id="btn-clear-history"
        type="button"
        class="text-[11px] font-semibold text-red-600 dark:text-red-400 hover:underline transition-colors cursor-pointer"
      >
        Hapus Semua
      </button>
    </div>
  </div>

  <!-- Search & Filter Bar -->
  <div class="px-5 mb-3 shrink-0">
    <div class="relative">
      <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 dark:text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="history-search"
        type="text"
        placeholder="Cari naskah, aksara, atau terjemahan…"
        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 text-[13px] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 transition-colors"
      />
    </div>

    <!-- Filter Tags -->
    <div class="flex items-center gap-1.5 mt-2.5 overflow-x-auto pb-1">
      <button type="button" data-filter="" class="history-tag active-tag px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-900 dark:bg-white text-white dark:text-zinc-950 transition-colors cursor-pointer whitespace-nowrap">Semua</button>
      <button type="button" data-filter="jawa" class="history-tag px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer whitespace-nowrap">Aksara Jawa</button>
      <button type="button" data-filter="kawi" class="history-tag px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer whitespace-nowrap">Kawi</button>
      <button type="button" data-filter="bali" class="history-tag px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer whitespace-nowrap">Bali</button>
    </div>
  </div>

  <!-- History List Container -->
  <div class="flex-1 overflow-y-auto px-5">
    <div id="history-list-container" class="flex flex-col gap-3"></div>

    <!-- Empty Archive State -->
    <div id="history-empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
      <div class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 flex items-center justify-center mb-4 text-slate-400 dark:text-zinc-500">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <h3 class="font-sans text-[16px] font-bold text-slate-900 dark:text-white mb-1">Belum Ada Naskah Tersimpan</h3>
      <p class="text-[12px] text-slate-500 dark:text-zinc-400 max-w-[220px] leading-relaxed mb-5">
        Mulai pindai lontar pertamamu untuk melestarikan warisan peradaban Nusantara.
      </p>
      <button
        id="btn-empty-scan"
        type="button"
        class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-zinc-100 text-white dark:text-zinc-950 font-bold text-[13px] shadow-sm transition-all cursor-pointer"
      >
        Pindai Sekarang
      </button>
    </div>
  </div>

</section>
